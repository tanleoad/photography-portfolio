<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture &mdash; Tanleo_</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #0a0908;
  --bg-elev: #131211;
  --text: #f3f0e9;
  --text-dim: #a6a29a;
  --text-faint: #706c64;
  --border: rgba(243,240,233,0.09);
  --accent: #c9a876;
  --edge: 8vw;
  --gutter: 2.5vw;
  --row-gap: 2.5vh;
  --block-gap: 2.5vh;
}
*{ box-sizing: border-box; }
html,body{ background: var(--bg); }
body{
  color: var(--text);
  font-family: 'Inter', sans-serif;
  margin: 0;
}
::selection{ background: var(--accent); color: var(--bg); }


.threshold{
  padding: 5vh clamp(1.5rem, 6vw, 4rem) 3vh;
}
.threshold h1{
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: clamp(1.3rem, 2.4vw, 1.9rem);
  margin: 0;
  letter-spacing: 0.01em;
  color: var(--text-dim);
}
.threshold-note{
  font-family: 'Inter', sans-serif;
  font-size: 0.85rem;
  margin: 0.9em 0 0;
  color: var(--text-faint);
}

.wall{
  display: flex;
  flex-direction: column;
  gap: var(--block-gap);
  padding: 0 var(--edge);
}

.block.columns{
  display: flex;
  align-items: flex-start;
  gap: var(--gutter);
}
.col{
  display: flex;
  flex-direction: column;
  gap: var(--row-gap);
  width: calc(50% - (var(--gutter) / 2));
  flex-shrink: 0;
}

.frame{
  background: var(--bg-elev);
  overflow: hidden;
}
.frame img{
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.block.full .frame{ width: 100%; }

.flat{
  display: flex;
  flex-direction: column;
  gap: var(--row-gap);
  padding: 0 var(--edge);
}
.flat .frame{ width: 100%; }

@media (max-width: 780px){
  :root{
    --edge: 6vw;
    --row-gap: 2.5vh;
  }
}
</style>
</head>
<body>
<div class="threshold">
  <h1>Architecture</h1>
  <p class="threshold-note">More photographs coming soon.</p>
</div>

<div class="wall" id="wall"></div>

<script>
// This page reuses the exact same rendering engine as street.html
// (same IMAGES/BLOCKS/FLAT data shape, same makeFrame/build/reveal
// logic) so Architecture behaves identically once photographs are
// curated. IMAGES/BLOCKS/FLAT are intentionally empty for now -- the
// photograph selection and sequencing for this page have not been
// curated yet. Do not populate these without an explicit decision on
// the image set; this page exists only to make Architecture a real,
// linkable destination consistent with Street and Photo Retouching.
var IMAGES = {};
var BLOCKS = [];
var FLAT = [];
var wall = document.getElementById('wall');

function makeFrame(id){
  var item = IMAGES[id];
  var frame = document.createElement('div');
  frame.className = 'frame';
  frame.style.aspectRatio = item.ratio;
  var img = document.createElement('img');
  img.src = item.src;
  img.loading = 'lazy';
  img.alt = '';
  frame.appendChild(img);
  return frame;
}

// Below 780px everything collapses to a single column. The left/right
// split above is a desktop balancing decision only -- on a single column
// the photographs must run in the photographer's actual curated order,
// so mobile renders the flat sequence directly rather than the grouped
// desktop structure stacked column-after-column.
function isMobile(){ return window.innerWidth <= 780; }

function build(){
  wall.innerHTML = '';
  if (isMobile()){
    wall.className = 'flat';
    FLAT.forEach(function(id){ wall.appendChild(makeFrame(id)); });
    return;
  }
  wall.className = 'wall';
  BLOCKS.forEach(function(b){
    var el = document.createElement('div');
    if (b.kind === 'full'){
      el.className = 'block full';
      el.appendChild(makeFrame(b.id));
    } else {
      el.className = 'block columns';
      var left = document.createElement('div');
      left.className = 'col';
      b.left.forEach(function(id){ left.appendChild(makeFrame(id)); });
      var right = document.createElement('div');
      right.className = 'col';
      b.right.forEach(function(id){ right.appendChild(makeFrame(id)); });
      el.appendChild(left);
      el.appendChild(right);
    }
    wall.appendChild(el);
  });
}

build();

var lastMobile = isMobile();
var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    if (isMobile() !== lastMobile){ lastMobile = isMobile(); build(); collectFrames(); }
  }, 200);
});

// ---------------------------------------------------------------------------
// Scroll reveal -- additive only. Does not touch layout: clip-path affects
// paint, not box size or position, so the frozen composition above (sizes,
// positions, column structure, spacing) is entirely unaffected. Each frame
// starts partially masked by a bottom clip and un-masks as it travels up
// through the lower part of the viewport; once fully revealed it holds
// completely still. Position, size and aspect ratio of every frame are
// untouched -- only the clip boundary moves.
// ---------------------------------------------------------------------------
var REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var REVEAL_FRACTION = 0.62;
var revealFrames = [];

function revealTick(){
  if (REDUCED_MOTION) return;
  var vh = window.innerHeight;
  for (var i = 0; i < revealFrames.length; i++){
    var f = revealFrames[i];
    var rect = f.getBoundingClientRect();
    var progress = (vh - rect.top) / (vh * REVEAL_FRACTION);
    if (progress < 0) progress = 0;
    if (progress > 1) progress = 1;
    var hiddenPct = (1 - progress) * 100;
    f.style.clipPath = 'inset(0 0 ' + hiddenPct.toFixed(2) + '% 0)';
  }
}

function collectFrames(){
  revealFrames = Array.prototype.slice.call(document.querySelectorAll('.frame'));
  if (REDUCED_MOTION){
    revealFrames.forEach(function(f){ f.style.clipPath = 'none'; });
    return;
  }
  revealTick();
}

var revealTicking = false;
window.addEventListener('scroll', function(){
  if (REDUCED_MOTION) return;
  if (!revealTicking){
    window.requestAnimationFrame(function(){
      revealTick();
      revealTicking = false;
    });
    revealTicking = true;
  }
}, { passive: true });

window.addEventListener('resize', function(){
  if (!REDUCED_MOTION) revealTick();
});

collectFrames();
</script>
</body>
</html>
