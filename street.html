<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street &mdash; Tanleo_</title>
<meta name="description" content="Street &mdash; a photographic exhibition by Tanleo_.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #0a0908;
  --text: #f3f0e9;
  --text-dim: #a6a29a;
  --text-faint: #59564f;
  --accent: #c9a876;
  --lightbox-bg: #0a0908;
  --lightbox-ink: #f3f0e9;
  --lightbox-ink-dim: #8c8880;
  --gap: 0.6vw;
}
*{ box-sizing: border-box; }
html,body{ background: var(--bg); }
body{
  color: var(--text);
  font-family: 'Inter', sans-serif;
  margin: 0;
}
::selection{ background: var(--accent); color: var(--bg); }

/* ---- Fixed minimal nav ---- */
.wall-nav{
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 40;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 2.2vh clamp(1.25rem, 4vw, 2.5rem) 4vh;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(10,9,8,0.55), rgba(10,9,8,0));
}
.wall-nav a{ pointer-events: auto; }
.wall-brand{
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 0.95rem;
  letter-spacing: 0.03em;
  color: var(--text);
  text-decoration: none;
  line-height: 1.4;
}
.wall-brand span{ color: var(--text-faint); }
.wall-brand small{
  display: block;
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.wall-links{
  display: flex;
  gap: clamp(1rem, 2.4vw, 1.8rem);
  list-style: none;
  margin: 0.15rem 0 0;
  padding: 0;
}
.wall-links a{
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-decoration: none;
}
.wall-links a:hover{ color: var(--text); }

/* ---- Opening threshold ---- */
.threshold{
  padding: 14vh clamp(1.25rem, 4vw, 2.5rem) 5vh;
}
.threshold h1{
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-style: italic;
  font-size: clamp(1.6rem, 3vw, 2.3rem);
  margin: 0;
  color: var(--text-dim);
}

/* ==========================================================
   The wall -- an irregular photographic exhibition composition.

   Deliberately NOT a CSS grid. A grid's tracks are shared: every
   tile that touches a given row is forced to that row's height,
   so a short photograph next to a tall one leaves dead black space
   underneath it -- an accidental void, not a composed one. That is
   the opposite of what an exhibition wall looks like.

   Instead this is a true masonry, matching the load-bearing mechanism
   of the Alan Schaller reference itself -- confirmed by inspecting
   the live page's own DOM directly: a Wix Pro Gallery "Masonry"
   layout, a fixed number of completely EQUAL-width independent
   columns (four at desktop widths there, ~293px each with a ~20px
   gutter, only ever varying by real image height), each tracking its
   own current height. No item ever spans more than one column there
   -- the irregular, freely-composed feeling comes entirely from real
   aspect-ratio diversity (tall portraits beside short landscapes)
   packed tight, not from varying column width. buildWall() below
   reproduces exactly that: N equal-width columns, each photograph
   placed into whichever column is currently shortest and given its
   exact pixel height from its own true aspect ratio (never stretched,
   never grid-rounded, never spanning). A photograph only ever touches
   one column, so it can never straddle columns of uneven height and
   strand a gap the way a multi-column grid span would; each column's
   next photograph simply continues from that column's own bottom
   edge, regardless of every other column. That is what makes the
   "no row-induced gap" guarantee structural rather than incidental.
   The wall is a plain positioning
   context (position: relative, height set by JS to fit its
   content); every tile is placed with an explicit pixel transform.
   Clicking a tile opens the lightbox below, not another page.
   ========================================================== */
.wall{
  position: relative;
  margin: 0 clamp(1.25rem, 4vw, 2.5rem) 10vh;
}
.tile{
  position: absolute;
  top: 0;
  left: 0;
  overflow: hidden;
  background: #131211;
  cursor: pointer;
  padding: 0;
  border: 0;
  display: block;
  will-change: transform;
}
.tile img{
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

@media (max-width: 780px){
  .threshold{ padding-top: 11vh; }
}

/* ==========================================================
   Lightbox -- full-screen viewing field, matching the reference's
   behaviour exactly except for one deliberate choice: the reference
   uses an off-white field, Tanleo uses black (--lightbox-bg, same
   value as the site's own --bg) to stay consistent with the rest of
   the site rather than copying the reference's colour. Photograph
   keeps its true aspect ratio (object-fit: contain, never cover) and
   is never cropped here. Opens over the wall, closes back to it; the
   URL never changes.

   Closing cross-fades rather than snapping instantly, matching the
   reference's own close transition: opacity is the only thing that
   moves, restrained (0.22s) and only on the lightbox itself -- the
   wall underneath never animates. display:none/flex was replaced
   with opacity+visibility so that transition can exist at all (you
   cannot transition display). visibility is delayed on the way out
   (only after the fade finishes) so the overlay stays hidden from
   assistive tech and pointer events the instant it's not wanted, but
   delayed on the way in (immediately) so the fade-in is visible from
   its first frame.

   Moving between photographs (prev/next) also cross-fades, matching
   the reference: the outgoing photograph dissolves out, the incoming
   one dissolves in -- opacity only, no slide, zoom, blur or scale.
   That fade lives on .lightbox-frame img itself (see showImage() in
   the script below) and is separate from the lightbox-level fade
   above; opening a photograph for the first time skips it (the
   photograph should simply be there the instant the lightbox itself
   has faded in, not fade in a second time on top of that). Respects
   prefers-reduced-motion below.
   ========================================================== */
.lightbox{
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--lightbox-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.lightbox.is-open{
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.lightbox-frame{
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(2rem, 8vh, 5rem) clamp(4.5rem, 9vw, 7rem);
}
.lightbox-frame img{
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  -webkit-user-drag: none;
}
.lightbox-close,
.lightbox-prev,
.lightbox-next{
  position: fixed;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  color: var(--lightbox-ink);
  cursor: pointer;
  line-height: 0;
}
.lightbox-close{
  top: clamp(1.25rem, 3.5vh, 2.25rem);
  right: clamp(1.25rem, 3.5vw, 2.5rem);
}
.lightbox-prev{
  left: clamp(1rem, 3vw, 2.25rem);
  top: 50%;
  transform: translateY(-50%);
}
.lightbox-next{
  right: clamp(1rem, 3vw, 2.25rem);
  top: 50%;
  transform: translateY(-50%);
}
.lightbox-close svg,
.lightbox-prev svg,
.lightbox-next svg{
  display: block;
  opacity: 0.55;
}
.lightbox-close:hover svg,
.lightbox-prev:hover svg,
.lightbox-next:hover svg{
  opacity: 1;
}

@media (prefers-reduced-motion: no-preference){
  .lightbox-frame img{ transition: opacity 0.15s ease; }
  .lightbox{
    transition: opacity 0.22s ease, visibility 0s linear 0.22s;
  }
  .lightbox.is-open{
    transition: opacity 0.22s ease, visibility 0s linear 0s;
  }
}
</style>
</head>
<body>

<header class="wall-nav">
  <a class="wall-brand" href="index.html">Tanleo<span>_</span><small>Street</small></a>
  <ul class="wall-links">
    <li><a href="index.html#projects">Work</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</header>

<div class="threshold">
  <h1>Street</h1>
</div>

<!-- Built entirely by buildWall() below from SEQUENCE. -->
<div class="wall" id="wall"></div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lbClose" aria-label="Close">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M2 2L20 20M20 2L2 20" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <button class="lightbox-prev" id="lbPrev" aria-label="Previous photograph">
    <svg width="14" height="26" viewBox="0 0 14 26" fill="none"><path d="M12 2L2 13L12 24" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="lightbox-next" id="lbNext" aria-label="Next photograph">
    <svg width="14" height="26" viewBox="0 0 14 26" fill="none"><path d="M2 2L12 13L2 24" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="lightbox-frame">
    <img id="lbImage" src="" alt="">
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   SEQUENCE is the one thing meant to be edited by hand.

   Order is the photographer's existing curated Street sequence
   (previously encoded as FLAT in the old wall layout), carried
   forward as a starting point -- not re-derived from filenames or
   the old HTML structure. `id` is a lookup key into
   images/street/<id>.jpg; `ratio` is that photograph's true measured
   pixel aspect ratio (used to size its tile height and never to crop
   more than the layout strictly requires). `size` ('S'|'M'|'L') is
   carried over from the previous layout and currently unused by
   buildWall() below -- the wall's columns are all equal width now
   (matching the reference), so a photograph's presence comes from
   its aspect ratio alone, not this field. Left in place rather than
   stripped out, in case a future layout wants it back.

   This exact array also IS the lightbox sequence, in the same
   order -- every photograph on the wall is reachable with next/
   previous, and there is nothing else to keep in sync.

   Order below is a deliberate viewing sequence, not filename or
   upload order: photographs alternate between horizontal and
   vertical format to create rhythm the way the Alan Schaller
   reference does, without mechanically alternating every single
   frame -- horizontal runs of 2-4 are allowed (sometimes because a
   pair genuinely rhymes, like the two feet/shadow frames near the
   top, the market-stall suite in the middle, or the two golden-hour
   palm-road frames bridging a vertical break), but never so long a
   run that the wall or the lightbox reads as monotonous. Every
   vertical frame is a deliberate breath between those runs.

   Reordering, resizing or recurating the wall is entirely a matter
   of editing this array -- move a row, change a size value. Nothing
   else in this file needs to change.
   ------------------------------------------------------------------ */
var SEQUENCE = [
  { id: "002", ratio: 1.4993, size: "S" },
  { id: "001", ratio: 0.8000, size: "M" },
  { id: "040", ratio: 1.4993, size: "S" },
  { id: "045", ratio: 1.4993, size: "M" },
  { id: "041", ratio: 1.4993, size: "S" },
  { id: "010", ratio: 0.8000, size: "L" },
  { id: "038", ratio: 1.4993, size: "S" },
  { id: "051", ratio: 1.5013, size: "S" },
  { id: "067", ratio: 1.4993, size: "M" },
  { id: "052", ratio: 0.8000, size: "L" },
  { id: "064", ratio: 1.4993, size: "S" },
  { id: "006", ratio: 1.4993, size: "M" },
  { id: "037", ratio: 1.4993, size: "M" },
  { id: "036", ratio: 1.4993, size: "L" },
  { id: "007", ratio: 0.8000, size: "M" },
  { id: "061", ratio: 1.5013, size: "L" },
  { id: "060", ratio: 1.5007, size: "S" },
  { id: "048", ratio: 1.5007, size: "M" },
  { id: "013", ratio: 0.8000, size: "L" },
  { id: "023", ratio: 1.4993, size: "S" },
  { id: "062", ratio: 1.4993, size: "S" },
  { id: "024", ratio: 0.8000, size: "L" },
  { id: "028", ratio: 1.5007, size: "M" },
  { id: "043", ratio: 1.4993, size: "M" },
  { id: "042", ratio: 1.5007, size: "M" },
  { id: "031", ratio: 0.8000, size: "L" },
  { id: "029", ratio: 1.4993, size: "S" },
  { id: "039", ratio: 1.5007, size: "S" },
  { id: "058", ratio: 1.4993, size: "S" },
  { id: "015", ratio: 0.8000, size: "S" },
  { id: "049", ratio: 1.5007, size: "S" },
  { id: "055", ratio: 1.5007, size: "M" },
  { id: "030", ratio: 1.5007, size: "S" },
  { id: "063", ratio: 1.5007, size: "L" }
];

function imgSrc(id){ return "images/street/" + id + ".jpg"; }

/* ------------------------------------------------------------------
   Build the wall as an equal-width column masonry -- see the CSS
   comment above .wall. NUM_COLS_* below sets how many columns exist
   per breakpoint (4 at desktop widths, matching what was measured
   directly on the reference page); every column gets the exact same
   pixel width, dividing the wall evenly with COL_GAP between them.
   Each photograph is placed into whichever column is currently
   shortest and given its own true pixel height (width / aspect
   ratio) -- never spanning more than one column, so it can never
   straddle columns of uneven height and strand a gap. The apparent
   irregularity of the wall comes entirely from real aspect-ratio
   diversity packed tight against a uniform column width, exactly as
   on the reference -- not from varying column width.
   ------------------------------------------------------------------ */
var wall = document.getElementById('wall');
var NUM_COLS_DESKTOP = 4;
var NUM_COLS_TABLET = 3;
var NUM_COLS_MOBILE = 2;

function columnCount(){
  var w = window.innerWidth;
  if (w <= 780) return NUM_COLS_MOBILE;
  if (w <= 1080) return NUM_COLS_TABLET;
  return NUM_COLS_DESKTOP;
}

function buildWall(){
  wall.innerHTML = '';
  var numCols = columnCount();
  var gapPx = wall.clientWidth * 0.016; /* matches the reference's measured ~20px / 1233px gutter ratio */
  var colWidth = (wall.clientWidth - gapPx * (numCols - 1)) / numCols;

  /* colBottoms[c] = that column's own current height, tracked
     completely independently of every other column. */
  var colBottoms = new Array(numCols).fill(0);

  SEQUENCE.forEach(function(item, i){
    var colIndex = 0;
    for (var c = 1; c < numCols; c++){
      if (colBottoms[c] < colBottoms[colIndex]) colIndex = c;
    }

    var tileWidth = colWidth;
    var tileHeight = tileWidth / item.ratio;
    var tileLeft = colIndex * (colWidth + gapPx);
    var tileTop = colBottoms[colIndex];

    var tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';
    tile.style.width = tileWidth + 'px';
    tile.style.height = tileHeight + 'px';
    tile.style.transform = 'translate3d(' + tileLeft + 'px, ' + tileTop + 'px, 0)';
    tile.setAttribute('aria-label', 'Open photograph ' + (i + 1) + ' of ' + SEQUENCE.length);

    var img = document.createElement('img');
    img.src = imgSrc(item.id);
    img.loading = i < 8 ? 'eager' : 'lazy';
    img.decoding = 'async';
    img.alt = '';
    tile.appendChild(img);

    tile.addEventListener('click', function(){ openLightbox(i); });
    wall.appendChild(tile);

    /* Only this one column advances -- every other column keeps its
       own independent height, exactly the guarantee the layout rests
       on. */
    colBottoms[colIndex] = tileTop + tileHeight + gapPx;
  });

  var wallHeight = Math.max.apply(null, colBottoms) - gapPx;
  wall.style.height = Math.max(0, wallHeight) + 'px';
}

buildWall();
var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(buildWall, 200);
});

/* ---- Lightbox: open/close/prev/next. Same page, same URL. ---- */
var lightbox = document.getElementById('lightbox');
var lbImage = document.getElementById('lbImage');
var lbPrev = document.getElementById('lbPrev');
var lbNext = document.getElementById('lbNext');
var lbClose = document.getElementById('lbClose');
var currentIndex = 0;

/* Matches the .lightbox-frame img transition duration in the CSS
   above -- kept as one number so the JS swap and the CSS fade never
   drift out of sync. */
var IMAGE_CROSSFADE_MS = 150;
var imageFadeTimer = null;

function prefersReducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

/* Swaps to photograph i. By default this is a cross-fade: the current
   photograph dissolves to transparent, its src is only swapped once
   it's fully invisible, then the new photograph dissolves in -- so
   the two images are never both fully visible at once and nothing
   ever slides, zooms or blurs. Pass {immediate:true} (used when a
   lightbox is first opened) or reduced-motion to skip straight to
   the new photograph at full opacity. */
function showImage(i, opts){
  currentIndex = (i + SEQUENCE.length) % SEQUENCE.length;
  var item = SEQUENCE[currentIndex];
  var nextSrc = imgSrc(item.id);
  var immediate = (opts && opts.immediate) || prefersReducedMotion();

  if (imageFadeTimer){
    clearTimeout(imageFadeTimer);
    imageFadeTimer = null;
  }

  if (immediate){
    lbImage.src = nextSrc;
    lbImage.alt = '';
    lbImage.style.opacity = '1';
    return;
  }

  lbImage.style.opacity = '0';
  imageFadeTimer = window.setTimeout(function(){
    lbImage.src = nextSrc;
    lbImage.alt = '';
    imageFadeTimer = null;
    /* Two frames: one for the browser to register the still-transparent
       new image, one to actually start the transition to opacity 1 --
       a single rAF can land before the src swap has been painted. */
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        lbImage.style.opacity = '1';
      });
    });
  }, IMAGE_CROSSFADE_MS);
}

function openLightbox(i){
  showImage(i, { immediate: true });
  lightbox.classList.add('is-open');
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(){
  lightbox.classList.remove('is-open');
  lightbox.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

lbClose.addEventListener('click', closeLightbox);
lbPrev.addEventListener('click', function(){ showImage(currentIndex - 1); });
lbNext.addEventListener('click', function(){ showImage(currentIndex + 1); });

/* Clicking the light field itself (not the photograph or a control)
   also closes -- a standard, expected lightbox affordance. */
lightbox.addEventListener('click', function(e){
  if (e.target === lightbox || e.target.classList.contains('lightbox-frame')){
    closeLightbox();
  }
});

document.addEventListener('keydown', function(e){
  if (!lightbox.classList.contains('is-open')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
  else if (e.key === 'ArrowRight') showImage(currentIndex + 1);
});
</script>
</body>
</html>
